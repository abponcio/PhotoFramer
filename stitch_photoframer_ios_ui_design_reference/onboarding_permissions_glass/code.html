<style>

<body class="bg-background text-on-background h-screen w-screen overflow-hidden flex flex-col relative font-body-md">
<!-- Blurred Background Image Container -->
<div class="absolute inset-0 z-0">
<img alt="Blurred Background" class="w-full h-full object-cover scale-110 filter blur-xl opacity-60" data-alt="A soft, out-of-focus background image featuring a serene beach scene at dawn or dusk. The light is warm and golden, blending beautifully with the pale blues of the sky and ocean. The colors are muted, creating a calm and inviting atmosphere. The overall style is highly evocative of travel and exploration, perfectly suiting a photography app's onboarding experience." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDYeUeR8RqTQ1chwMvz5Y863D6-2k1niav-sSt1fFDADGiZAM1yQ1T_fFr7JYp-VAwm4x1JZKToeittbqjhEROz70xTX1-GahqF8Eh7SQR2gneWIsHPHugAUrbWK4cr2v6gb7Htxn4TcBnSYFDllhnbDbFAvFnra6hij1U2dwYqb-5sDUw6-5JzYD7hu7Y473YNp2Nc74eljwkifpxHWEHzp4zVnue8xVU4wkQ9mR0pmXmHZISABbb9xXGkmd0Y4Sus-Wea9NIPcci7"/>
<!-- Gradient Overlay to ensure text readability -->
<div class="absolute inset-0 bg-gradient-to-b from-surface-bright/40 to-surface/80"></div>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 relative z-10 flex flex-col justify-center items-center px-lg pb-3xl w-full max-w-md mx-auto h-full">
<!-- Onboarding Card (Glassmorphism) -->
<div class="bg-frosted rounded-3xl p-xl w-full flex flex-col items-center text-center transform transition-all duration-500 opacity-0 translate-y-8" id="onboarding-card">
<!-- Icon Container -->
<div class="w-2xl h-2xl rounded-full bg-primary-container/20 flex items-center justify-center mb-lg ring-1 ring-primary-container/30">
<span class="material-symbols-outlined text-[32px] text-primary" style="font-variation-settings: 'FILL' 1;">
                    photo_camera
                </span>
</div>
<!-- Typography -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm md:font-headline-lg md:text-headline-lg">
                Camera Access Required
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl max-w-[280px]">
                PhotoFramer needs access to your camera to provide real-time composition coaching and guides over your live feed.
            </p>
<!-- Feature List -->
<ul class="w-full text-left space-y-sm mb-2xl">
<li class="flex items-start gap-sm">
<span class="material-symbols-outlined text-[20px] text-primary mt-1">check_circle</span>
<div class="font-body-md text-body-md text-on-surface-variant">Live framing overlays</div>
</li>
<li class="flex items-start gap-sm">
<span class="material-symbols-outlined text-[20px] text-primary mt-1">check_circle</span>
<div class="font-body-md text-body-md text-on-surface-variant">Real-time coaching scores</div>
</li>
</ul>
<!-- Primary Action Button -->
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-md rounded-full hover:opacity-90 active:scale-95 transition-all shadow-md shadow-primary-container/20 mb-md" onclick="enableCamera()">
                Enable Camera
            </button>
<!-- Secondary Action -->
<button class="font-label-mono text-label-mono text-outline hover:text-on-surface transition-colors">
                Skip for now
            </button>
</div>
</main>
<!-- Simple Script for Animation -->
<script>
        document.addEventListener("DOMContentLoaded", () => {
            const card = document.getElementById('onboarding-card');
            setTimeout(() => {
                card.classList.remove('opacity-0', 'translate-y-8');
            }, 100);
        });

        function enableCamera() {
            // Placeholder interaction
            const btn = document.querySelector('button');
            const originalText = btn.innerText;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin mr-2">progress_activity</span> Requesting...`;
            btn.classList.add('opacity-80', 'pointer-events-none');
            
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined mr-2">check</span> Access Granted`;
                btn.classList.remove('bg-primary-container', 'text-on-primary-container');
                btn.classList.add('bg-secondary-container', 'text-on-surface');
            }, 1500);
        }
    </script>
